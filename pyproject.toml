[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mapping"
version = "0.1.0"
description = "Reproducible image-based tunnel-face geological candidate mapping MVP"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "scikit-image>=0.23,<0.27",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
neo4j = ["neo4j>=5.20,<6"]

[project.scripts]
face-mapping = "face_mapping.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
