services:
  neo4j:
    image: neo4j:5-community
    container_name: face-mapping-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - face_mapping_neo4j_data:/data
      - face_mapping_neo4j_logs:/logs

volumes:
  face_mapping_neo4j_data:
  face_mapping_neo4j_logs:
